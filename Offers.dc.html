<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Alex+Brush&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0" rel="stylesheet">
<script src="./data.js"></script>
<style>
body{margin:0;background:#faf7f2;color:#1b2a3d;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#a8742b;text-decoration:none}
a:hover{color:#7d5319}
button{font-family:inherit}
@keyframes kwFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="min-height:100vh;background:#faf7f2">
  <dc-import name="Header" active="" hint-size="100%,78px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <dc-import name="PageBanner" eyebrow="SPECIAL OFFERS" title="Exclusive Travel Deals" crumb="Offers" sub="Save on tour packages, hotel bookings and drivers. Apply the code while booking." src="img/hero-sunset.png" hint-size="100%,320px"></dc-import>
  <section style="max-width:1280px;margin:0 auto;padding:44px 28px 72px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px">
    <sc-for list="{{ offers }}" as="o" hint-placeholder-count="4">
      <div style="background:#fff;border:1px solid #f0e9dd;border-radius:18px;overflow:hidden;box-shadow:0 8px 26px rgba(20,35,60,.07);display:flex;flex-direction:column">
        <div style="position:relative;aspect-ratio:1.9/1"><img src="{{ o.src }}" alt="{{ o.title }}" style="width:100%;height:100%;object-fit:cover;display:block">
          <span style="position:absolute;top:12px;left:12px;background:linear-gradient(180deg,#c99a47,#93621f);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700">{{ o.off }}</span></div>
        <div style="padding:20px;display:flex;flex-direction:column;flex:1">
          <div style="font-family:'DM Serif Display',serif;font-size:21px;color:#0e2340">{{ o.title }}</div>
          <p style="margin:6px 0 0;font-size:14px;line-height:1.6;color:#4a5566;flex:1">{{ o.desc }}</p>
          <div style="margin-top:10px;font-size:12px;color:#7a8594;display:flex;align-items:center;gap:6px"><span class="material-symbols-outlined" style="font-size:15px;color:#a8742b">schedule</span>{{ o.valid }}</div>
          <div style="margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px">
            <div style="flex:1 1 190px;min-width:0;height:44px;border:1.5px dashed #d0a35a;border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 14px;background:#fdf8ef">
              <span style="font-weight:700;letter-spacing:1.5px;font-size:14px;color:#7d5319">{{ o.code }}</span>
              <button onClick="{{ o.copy }}" style="flex-shrink:0;height:32px;padding:0 12px;border:none;border-radius:8px;background:#fff;color:#a8742b;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px"><span class="material-symbols-outlined" style="font-size:15px">{{ o.copyIcon }}</span>{{ o.copyLabel }}</button>
            </div>
            <a href="{{ o.href }}" style="flex:1 0 auto;height:44px;padding:0 18px;border-radius:999px;background:#0e2340;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap">Use Offer <span class="material-symbols-outlined" style="font-size:16px">arrow_forward</span></a>
          </div>
        </div>
      </div>
    </sc-for>
  </section>
  <dc-import name="Footer" hint-size="100%,150px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { copied: '' };
  componentDidMount() { if (!window.KD) this.t = setInterval(() => { if (window.KD) { clearInterval(this.t); this.forceUpdate(); } }, 30); }
  componentWillUnmount() { clearInterval(this.t); clearTimeout(this.c); }
  renderVals() {
    const D = window.KD; if (!D) return {};
    return {
      offers: D.offers.map(o => ({ ...o,
        href: D.url('Booking', { service: o.code === 'DRIVE20' ? 'Driver Assign' : 'Tour Package', pkg: o.pkg, offer: o.code }),
        copyLabel: this.state.copied === o.code ? 'Copied' : 'Copy', copyIcon: this.state.copied === o.code ? 'check' : 'content_copy',
        copy: () => { try { navigator.clipboard.writeText(o.code); } catch (e) {} clearTimeout(this.c); this.setState({ copied: o.code }); this.c = setTimeout(() => this.setState({ copied: '' }), 1800); } }))
    };
  }
}
</script>
</body>
</html>
