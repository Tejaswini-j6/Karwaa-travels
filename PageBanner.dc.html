<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="position:relative;background:linear-gradient(170deg,#e9f2f7 0%,#f4f1ea 55%,#f8f1e4 100%);overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;border-bottom-left-radius:50% 22px;border-bottom-right-radius:50% 22px">
  <div style="position:absolute;top:0;right:0;width:62%;height:100%;-webkit-mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.6) 25%,#000 50%);mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,.6) 25%,#000 50%)">
    <img src="{{ src }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
  </div>
  <div style="position:relative;max-width:1280px;margin:0 auto;padding:clamp(48px,6vw,80px) 28px clamp(52px,6vw,84px)">
    <div style="max-width:560px">
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#4a5566">
        <a href="Karwaa Website.dc.html" style="color:#a8742b;text-decoration:none">Home</a>
        <span class="material-symbols-outlined" style="font-size:14px">chevron_right</span>
        <span>{{ crumb }}</span>
      </div>
      <div style="margin-top:18px;font-size:11px;font-weight:700;letter-spacing:2.4px;color:#a8742b">{{ eyebrow }}</div>
      <h1 style="margin:12px 0 0;font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(36px,4.4vw,56px);line-height:1.05;color:#0e2340">{{ title }}</h1>
      <p style="margin:16px 0 0;font-size:15px;line-height:1.65;color:#2c3a4d;max-width:460px;text-wrap:pretty;background:rgba(248,244,236,.55);border-radius:8px">{{ sub }}</p>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:320},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About Karwaa&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ABOUT US&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About Us&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;img/hero-mountains.png&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
